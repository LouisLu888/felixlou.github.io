name: AI 实战派 daily issue

# Fetches sources, curates the day's issue with Claude, and commits the result
# to public/ai-practice/ and docs/ai-practice/. jiabinlu.com is served from
# docs/ on master, so the commit itself publishes www.jiabinlu.com/ai-practice/.
# Pipeline code lives in ai-practice/ (see ai-practice/README.md).

on:
  schedule:
    # 14:23 UTC = 7:23 PDT / 6:23 PST. Off the top of the hour, where GitHub
    # Actions queues are busiest.
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate today even if the issue exists'
        type: boolean
        default: false
      check_only:
        description: 'Only run the source health check (no fetch state, no commit)'
        type: boolean
        default: false

concurrency:
  group: ai-practice-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # Screening + writing with Opus takes a few minutes; cap runaway runs.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-practice/scripts/package-lock.json

      - name: Install dependencies
        run: cd ai-practice/scripts && npm ci

      - name: Check sources only
        if: ${{ inputs.check_only }}
        run: cd ai-practice/scripts && node check-sources.js

      - name: Fetch sources
        if: ${{ !inputs.check_only }}
        run: cd ai-practice/scripts && node fetch-sources.js

      # Two ways to pay for Claude, checked in this order:
      # 1. ANTHROPIC_API_KEY: Claude API, billed per token
      # 2. CLAUDE_CODE_OAUTH_TOKEN: your Claude subscription via the Claude Code
      #    CLI (create it locally with `claude setup-token`)
      - name: Curate with Claude
        if: ${{ !inputs.check_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: |
          cd ai-practice/scripts
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            node curate.js --engine api $FORCE_FLAG
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # An empty ANTHROPIC_API_KEY would shadow the subscription token.
            unset ANTHROPIC_API_KEY
            npm install -g @anthropic-ai/claude-code
            node curate.js --engine cli $FORCE_FLAG
          else
            echo "::warning::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set; candidates fetched, no issue generated"
          fi

      - name: Build indexes and publish to docs/
        if: ${{ !inputs.check_only }}
        run: cd ai-practice/scripts && node build-index.js

      # No [skip ci] in the message: on a branch-deployed Pages site it would
      # also skip the Pages build, and the new issue would never go live.
      - name: Commit
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-practice/state/seen.json public/ai-practice/ docs/ai-practice/
          if git diff --cached --quiet; then
            echo "Nothing new to publish"
            exit 0
          fi
          git commit -m "AI 实战派: daily issue $(TZ=America/Los_Angeles date +%F)"
          # The blog is also edited by hand; rebase onto anything pushed meanwhile.
          git pull --rebase origin master
          git push origin HEAD:master
